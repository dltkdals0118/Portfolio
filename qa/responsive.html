<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Responsive QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:12px;display:flex;gap:10px;position:sticky;top:0;background:#fff;z-index:2}button,select{padding:8px}iframe{display:block;margin:20px auto;border:1px solid #888;width:390px;height:844px;background:white;max-width:100%}</style><header><button data-width="320" data-height="740">Mobile 320</button><button data-width="360" data-height="800">Mobile 360</button><button data-width="390" data-height="844">Mobile 390</button><button data-width="768" data-height="1024">Tablet 768</button><button data-width="1024" data-height="768">Tablet 1024</button><select aria-label="검수 화면"><option value="index.html#top">Home / Top</option><option value="index.html#work">Home / Selected Projects</option><option value="index.html#career">Home / Career</option><option value="index.html#contact">Home / Contact</option><option value="projects/seo.html">Case / 검색 개선</option><option value="projects/seo.html#technical">Case / 개발 요청서</option><option value="projects/seo.html#aeo">Case / AI 인용</option><option value="projects/automation.html">Case / 업무 자동화</option><option value="projects/eye-app.html">Case / 안과 앱</option><option value="projects/skin-app.html">Case / 피부과 앱</option><option value="404.html">404</option><option value="demo">WACUS App Demo</option></select></header><iframe title="Responsive portfolio preview" src="../index.html#top"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';frame.style.height=b.dataset.height+'px'});document.querySelector('select').onchange=e=>frame.src=e.target.value==='demo'?'../demos/wacus-app/?embed=1':'../'+e.target.value;</script></html>
