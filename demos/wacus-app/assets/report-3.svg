<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1200" height="675" rx="0" fill="#F6F8FC"/><rect x="0" y="0" width="18" height="675" rx="0" fill="#1B62E8"/><text x="60" y="58" font-size="20" fill="#1B62E8" font-weight="700">WACUS / CLINIC A</text><text x="890" y="58" font-size="18" fill="#788DAA" font-weight="700">SAMPLE REPORT</text><text x="60" y="110" font-size="16" fill="#788DAA" font-weight="700">03 / CONVERSION</text><text x="60" y="175" font-size="43" fill="#17263D" font-weight="700">예약 전환 추이</text><text x="60" y="215" font-size="21" fill="#62758F" font-weight="400">신청부터 확인까지 필요한 정보를 정리합니다.</text><rect x="60" y="260" width="650" height="290" rx="8" fill="#FFFFFF"/><rect x="740" y="260" width="400" height="290" rx="8" fill="#FFFFFF"/><text x="88" y="299" font-size="20" fill="#17263D" font-weight="700">샘플 지표의 변화</text><rect x="98" y="414.7" width="48" height="90.30000000000001" rx="6" fill="#BED1EE"/><text x="99" y="531" font-size="13" fill="#8392A6" font-weight="400">D1</text><rect x="179" y="383.74" width="48" height="121.26000000000002" rx="6" fill="#BED1EE"/><text x="180" y="531" font-size="13" fill="#8392A6" font-weight="400">D2</text><rect x="260" y="408.68" width="48" height="96.32000000000001" rx="6" fill="#BED1EE"/><text x="261" y="531" font-size="13" fill="#8392A6" font-weight="400">D3</text><rect x="341" y="351.91999999999996" width="48" height="153.08" rx="6" fill="#BED1EE"/><text x="342" y="531" font-size="13" fill="#8392A6" font-weight="400">D4</text><rect x="422" y="376.86" width="48" height="128.14000000000001" rx="6" fill="#BED1EE"/><text x="423" y="531" font-size="13" fill="#8392A6" font-weight="400">D5</text><rect x="503" y="332.14" width="48" height="172.86" rx="6" fill="#BED1EE"/><text x="504" y="531" font-size="13" fill="#8392A6" font-weight="400">D6</text><rect x="584" y="345.9" width="48" height="159.10000000000002" rx="6" fill="#1B62E8"/><text x="585" y="531" font-size="13" fill="#8392A6" font-weight="400">D7</text><text x="774" y="307" font-size="15" fill="#788DAA" font-weight="700">OPERATION NOTES</text><text x="774" y="362" font-size="28" fill="#17263D" font-weight="700">추이와 비교 기준</text><text x="774" y="405" font-size="17" fill="#62758F" font-weight="400">단일 수치보다 변화의 맥락을 확인</text><rect x="774" y="445" width="331" height="66" rx="8" fill="#EAF1FE"/><text x="794" y="485" font-size="20" fill="#1B62E8" font-weight="700">진단  →  확인  →  실행</text><text x="60" y="617" font-size="17" fill="#788DAA" font-weight="400">프로토타입 조작을 위한 예시 문서입니다. 실제 고객사 리포트가 아닙니다.</text><text x="1090" y="628" font-size="16" fill="#788DAA" font-weight="700">03 / 06</text></svg>