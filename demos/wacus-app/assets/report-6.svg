<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1200" height="675" rx="0" fill="#F6F8FC"/><rect x="0" y="0" width="18" height="675" rx="0" fill="#1B62E8"/><text x="60" y="58" font-size="20" fill="#1B62E8" font-weight="700">WACUS / CLINIC A</text><text x="890" y="58" font-size="18" fill="#788DAA" font-weight="700">SAMPLE REPORT</text><text x="60" y="110" font-size="16" fill="#788DAA" font-weight="700">06 / NEXT ACTIONS</text><text x="60" y="175" font-size="43" fill="#17263D" font-weight="700">다음 운영 액션</text><text x="60" y="215" font-size="21" fill="#62758F" font-weight="400">진단에서 실행할 항목을 연결합니다.</text><rect x="60" y="255" width="1080" height="82" rx="8" fill="#FFFFFF"/><text x="94" y="305" font-size="27" fill="#17263D" font-weight="700">01  예약 CTA 위치 검토</text><rect x="60" y="354" width="1080" height="82" rx="8" fill="#FFFFFF"/><text x="94" y="404" font-size="27" fill="#17263D" font-weight="700">02  검색 유입 페이지 보강</text><rect x="60" y="453" width="1080" height="82" rx="8" fill="#FFFFFF"/><text x="94" y="503" font-size="27" fill="#17263D" font-weight="700">03  전환 이벤트 집계 점검</text><text x="60" y="617" font-size="17" fill="#788DAA" font-weight="400">프로토타입 조작을 위한 예시 문서입니다. 실제 고객사 리포트가 아닙니다.</text><text x="1090" y="628" font-size="16" fill="#788DAA" font-weight="700">06 / 06</text></svg>